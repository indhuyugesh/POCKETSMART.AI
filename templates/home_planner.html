{% extends 'base.html' %}{% block content %}<section class="planner-head"><h1>Home Interior Budget Planner</h1><p>Create a customized budget plan for your dream home interior.</p></section><div class="container"><div class="form-card"><form id="planner"><label>Total Budget (INR)</label><input name="total_budget" type="number" min="1" step="1" value="50000" required><div class="check-row"><div><label>Number of Lights/Fixtures</label><input name="num_lights" type="number" min="0" value="5"></div><div><label>Number of Ceiling Fans</label><input name="num_fans" type="number" min="0" value="4"></div><div><label>Furniture Pieces</label><input name="num_furniture" type="number" min="0" value="2"></div><div><label>Dining Tables</label><input name="num_dining_tables" type="number" min="0" value="1"></div></div><label>Rooms to Include</label><div class="check-row">{% for room in ['Living Room','Kitchen','Bedroom','Dining Room'] %}<label class="check"><input type="checkbox" name="rooms" value="{{room}}">{{room}}</label>{% endfor %}</div><label>Special Requirements or Preferences</label><textarea name="requirements" placeholder="Any specific requirements or preferences"></textarea><button class="btn btn-primary" style="margin-top:20px">Generate Recommendation</button></form><div id="result" class="result"></div></div></div><script src="/static/app.js"></script><script>window.initPlanner('home',document.getElementById('planner'),document.getElementById('result'))</script>{% endblock %}
