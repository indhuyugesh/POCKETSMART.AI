{% extends 'base.html' %}{% block content %}<section class="planner-head"><h1>Jewelry Budget Planner</h1><p>Find jewelry ideas that match your occasion and budget.</p></section><div class="container"><div class="form-card"><form id="planner" enctype="multipart/form-data"><label>Total Budget (INR)</label><input name="total_budget" type="number" min="1" value="15000" required><label>Occasion</label><select name="occasion"><option>Wedding</option><option>Birthday</option><option>Engagement</option><option>Festival</option><option>Party</option><option>Casual</option></select><label>Preferences</label><textarea name="preferences" placeholder="Metal, color, style, traditional/modern, etc."></textarea><label>Optional Outfit Image</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp"><p class="muted">Max 5 MB. The image is used only to help style the recommendation.</p><button class="btn btn-primary" style="margin-top:20px">Generate Recommendation</button></form><div id="result" class="result"></div></div></div><script src="/static/app.js"></script><script>window.initPlanner('jewelry',document.getElementById('planner'),document.getElementById('result'))</script>{% endblock %}
