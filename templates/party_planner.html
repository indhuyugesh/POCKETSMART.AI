{% extends 'base.html' %}{% block content %}<section class="planner-head"><h1>Party Budget Planner</h1><p>Plan your perfect event with AI-powered budget recommendations.</p></section><div class="container"><div class="form-card"><form id="planner"><label>Total Budget (INR)</label><input name="total_budget" type="number" min="1" value="50000" required><label>Party Type</label><select name="party_type"><option>Birthday</option><option>Wedding</option><option>Engagement</option><option>Family Function</option><option>Corporate Event</option></select><label>Venue Type</label><select name="venue_type"><option>Banquet Hall</option><option>Community Hall</option><option>Outdoor</option><option>Restaurant</option><option>Home</option></select><label>Number of Guests</label><input name="num_guests" type="number" min="1" value="50"><label>Party Needs</label><div class="check-row"><label class="check"><input name="needs_catering" type="checkbox">Catering</label><label class="check"><input name="needs_decoration" type="checkbox">Decoration</label><label class="check"><input name="needs_entertainment" type="checkbox">Entertainment</label></div><label>Additional Requirements</label><textarea name="additional_requirements"></textarea><button class="btn btn-primary" style="margin-top:20px">Generate Recommendation</button></form><div id="result" class="result"></div></div></div><script src="/static/app.js"></script><script>window.initPlanner('party',document.getElementById('planner'),document.getElementById('result'))</script>{% endblock %}
