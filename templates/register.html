{% extends 'base.html' %}{% block content %}<div class="form-wrap"><div class="form-card"><h1>Create Your Account</h1><p class="muted">Start using PocketSmart.</p>{% if request.query_params.get('error') %}<div class="alert">{{ request.query_params.get('error') }}</div>{% endif %}<form method="post" action="/register"><label>Username</label><input name="username" required minlength="3"><label>Email</label><input name="email" type="email" required><label>Full Name</label><input name="full_name"><label>Password</label><input name="password" type="password" required minlength="6"><label>Confirm Password</label><input id="confirm" type="password" required><button class="btn btn-primary" style="width:100%;margin-top:22px">Create Account</button></form><p class="muted">Already have an account? <a href="/login" style="color:#07569a">Sign In</a></p></div></div><script>document.querySelector('form').addEventListener('submit',e=>{if(document.getElementById('confirm').value!==document.querySelector('[name=password]').value){e.preventDefault();alert('Passwords do not match')}})</script>{% endblock %}
